name: ZIP entpacken & Android-APK bauen

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repository herunterladen
        uses: actions/checkout@v4

      - name: 2. ZIP-Datei(en) automatisch entpacken
        id: unpack
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          shopt -s nullglob
          for z in *.zip; do
            echo "Entpacke $z ..."
            unzip -o -q "$z" -d "$RUNNER_TEMP/unpacked"
          done
          if [ -f settings.gradle.kts ]; then
            ROOT="$GITHUB_WORKSPACE"
          else
            SETTINGS=$(find "$RUNNER_TEMP/unpacked" -name settings.gradle.kts | head -n 1)
            if [ -n "$SETTINGS" ]; then ROOT=$(dirname "$SETTINGS"); fi
          fi
          if [ -z "$ROOT" ]; then
            echo "Noch keine ZIP mit Projekt gefunden - nichts zu bauen."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Projektordner: $ROOT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          fi

      - name: 3. Java 17 einrichten
        if: steps.unpack.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Android SDK einrichten
        if: steps.unpack.outputs.found == 'true'
        uses: android-actions/setup-android@v3

      - name: 5. Gradle 8.7 einrichten
        if: steps.unpack.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. APK bauen
        if: steps.unpack.outputs.found == 'true'
        working-directory: ${{ steps.unpack.outputs.root }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 7. APK als Download bereitstellen
        if: steps.unpack.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-Guard-APK
          path: ${{ steps.unpack.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
